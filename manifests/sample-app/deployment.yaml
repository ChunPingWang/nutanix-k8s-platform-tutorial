---
# 範例應用 Deployment
# 使用 nginx 作為簡單的 Web 應用，驗證完整的平台功能
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-web
    app.kubernetes.io/part-of: nkp-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-web
        app.kubernetes.io/part-of: nkp-poc
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      securityContext:
        runAsNonRoot: false  # nginx 需要 root
