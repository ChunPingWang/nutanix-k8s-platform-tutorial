---
# MetalLB IP Address Pool
# 從 VirtualBox Host-Only Network 分配 IP 範圍給 LoadBalancer Services
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.56.200-192.168.56.250
---
# L2 Advertisement (使用 ARP 廣播)
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
