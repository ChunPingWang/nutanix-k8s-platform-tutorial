---
# Ansible Inventory for NKP PoC 方案 B
all:
  children:
    # Management Cluster - 運行平台服務
    mgmt_cluster:
      hosts:
        mgmt:
          ansible_host: 192.168.56.10
          kubernetes_role: control-plane

    # Workload Cluster - 運行應用工作負載
    workload_cluster:
      hosts:
        workload-1:
          ansible_host: 192.168.56.21
          kubernetes_role: control-plane
        workload-2:
          ansible_host: 192.168.56.22
          kubernetes_role: worker

    # 所有 K8s 節點
    k8s_nodes:
      children:
        mgmt_cluster:
        workload_cluster:

  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: "{{ playbook_dir }}/../.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_python_interpreter: /usr/bin/python3

    # Kubernetes 版本
    kubernetes_version: "1.29"
    kubernetes_apt_version: "1.29.*"

    # Pod 網路 CIDR
    pod_network_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"

    # MetalLB IP Range (從 Host-Only Network 分配)
    metallb_ip_range: "192.168.56.200-192.168.56.250"

    # NIP.io 基礎域名 (使用 mgmt node IP)
    base_domain: "192.168.56.10.nip.io"
